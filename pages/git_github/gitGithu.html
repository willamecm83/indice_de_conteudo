<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Índice de Conteúdo - Formaticabit</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <header>
      <a href="https://git-scm.com/" target="_blank">
        <img
          src="https://git-scm.com/images/logos/downloads/Git-Logo-2Color.png"
          alt="Logo Git"
        />
      </a>
      <a href="https://github.com/" target="_blank">
        <img
          src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          alt="Logo GitHub"
        />
      </a>
    </header>

    <!-- Newsletter Substack -->
    <div class="newsletter">
      <iframe
        src="https://formaticabit.substack.com/embed"
        width="480"
        height="320"
        scrolling="no"
      ></iframe>
    </div>

    <main>
      <h1>📚 Índice de Conteúdo</h1>
      <h2>Básico sobre o Git</h2>
      <ul>
        <li>
          <a
            href="https://formaticabit.substack.com/p/o-que-e-o-git"
            target="_blank"
            >O que é o Git</a
          >
        </li>
        <li>
          <a
            href="https://formaticabit.substack.com/p/os-3-estados-do-git"
            target="_blank"
            >Os estágios do Git</a
          >
        </li>
        <li>
          <a
            https://formaticabit.substack.com/p/criar-configurar-repositorio-git
            >Configurar de forma correta seu repositorio Git!</a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
